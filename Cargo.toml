[package]
name = "horizon-mod-simple-voice-chat"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Simple Voice Chat client for Horizon: proximity and group voice over the game's mod channels. A clean-room original implementation of the wire protocol."

# The mod logic and its tests: the same file the bundle adds to the game.
[lib]
path = "mixins/svc_client/runtime.rs"

[dependencies]
svc_client_protocol = { path = "mixins/svc_client/protocol" }
svc_client_session = { path = "mixins/svc_client/session" }
svc_client_audio = { path = "mixins/svc_client/audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = [
    "mixins/svc_client/session",
    "crates/svc_client",
    "mixins/svc_client/audio", "mixins/svc_client/protocol"]
resolver = "3"
